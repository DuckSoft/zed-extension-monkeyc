name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Stable Rust and formatting bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --target wasm32-wasip2 -- -D warnings
      - run: cargo build --locked --release --target wasm32-wasip2
      - name: Install pinned native formatter
        run: >-
          cargo install --git https://github.com/DuckSoft/monkeyc-fmt
          --rev c69c2a5d348d447192d29935049309fe2276f59e --locked monkeyc-fmt
      - run: node --test tests/server.test.mjs
